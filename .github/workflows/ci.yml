name: CI

on:
  push:
    branches:
    - master

  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are wasted work, so they are cancelled. Runs for master
  # are not cancelled once started, but GitHub still drops a pending run when
  # a newer one queues behind it, so a release may need CI re-run on its commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      BUILD_PROFILE: ${{ matrix.os == 'windows-latest' && 'release' || 'debug' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, ubuntu-22.04-arm]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: true
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        # Pinned so lints and release builds match. Keep in sync with
        # release.yml.
        toolchain: 1.99.1

    - name: Restore Rust Cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ matrix.os }}-cargo-

    - name: Build and test
      run: cargo test --workspace --locked --verbose ${{ matrix.os == 'windows-latest' && '--release' || '' }}

    - name: Export embedded Studio plugin
      shell: bash
      run: target/${{ env.BUILD_PROFILE }}/rojo plugin install --plugins-dir artifacts

    - name: Test Windows release during Git and package churn
      if: matrix.os == 'windows-latest'
      run: |
        python -m pip install msgpack==1.2.4
        python scripts/watcher-smoke.py target/release/rojo.exe

    - name: Cache pinned semantic merge engine
      if: matrix.os == 'windows-latest'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/rbx-merge-d6375bde1bdc1f08437324ebfbd6bfcc655e90d0
        key: Windows-x64-rbx-merge-d6375bde1bdc1f08437324ebfbd6bfcc655e90d0

    - name: Test semantic merges and linked worktree Git drivers
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $engineRoot = Join-Path $env:RUNNER_TEMP 'rbx-merge-d6375bde1bdc1f08437324ebfbd6bfcc655e90d0'
        $engine = Join-Path $engineRoot 'bin/rbx-merge.exe'
        if (-not (Test-Path -LiteralPath $engine)) {
          & .\target\release\rojo.exe merge install-engine --root $engineRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $env:ROJO_TEST_RBX_MERGE = $engine
        cargo test --release --locked --test merge_backend -- --ignored

    - name: Upload Windows CLI and Studio plugin
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Rojo-Windows-x64
        path: |
          target/release/rojo.exe
          artifacts/RojoManagedPlugin.rbxm
          LICENSE.txt
          DEVELOPMENT.md

    - name: Save Rust Cache
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: true
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: 1.88.0

    - name: Restore Rust Cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-

    - name: Build
      run: cargo build --locked --verbose

    - name: Save Rust Cache
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  lint:
    name: Rustfmt, Clippy, Stylua, & Selene
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: true
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        # Pinned so lints and release builds match. Keep in sync with
        # release.yml.
        toolchain: 1.99.1
        components: rustfmt, clippy

    - name: Restore Rust Cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-

    - name: Setup Rokit
      uses: CompeyDev/setup-rokit@d49be92bd9502180218c3f43e7988faa945217b0 # v0.1.2
      with:
        version: 'v1.1.0'

    - name: Stylua
      run: stylua --check plugin/src plugin/http plugin/log plugin/fmt plugin/run-tests.server.lua

    - name: Selene
      run: selene plugin/src plugin/http plugin/log plugin/fmt plugin/run-tests.server.lua

    - name: Rustfmt
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Save Rust Cache
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  gate:
    name: Fork CI
    # always() keeps the gate running, and failing, when a needed job fails or
    # the run is cancelled. A skipped gate would satisfy branch protection.
    if: always()
    needs: [build, msrv, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and lint job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
