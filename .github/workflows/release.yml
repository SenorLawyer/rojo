name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Build jobs run third-party build scripts, so they only get read access. A
# single final job with write access publishes everything they produced.
jobs:
  ci-gate:
    name: Require passing CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      # 7.7 releases are tagged on this branch rather than on master, which
      # holds the 8.0 line. A tag workflow runs the workflow file of the
      # tagged commit, so this copy is the one that 7.7 tags use.
      RELEASE_BRANCH: release/7.7
    steps:
      # Full history is needed to check ancestry against the release branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      # Pull request CI runs test a merge ref but are recorded under the PR
      # head SHA, so they do not prove this commit passed CI on its own.
      # Releases must come from the release branch, and only push runs on it
      # count.
      - name: Require the tagged commit to be on the release branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::$GITHUB_SHA is not on $RELEASE_BRANCH. Tag a commit that has been merged to $RELEASE_BRANCH."
            exit 1
          fi

      - name: Check CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --event push --branch "$RELEASE_BRANCH" --status success --json databaseId --jq 'length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::The CI workflow has not succeeded on a push to $RELEASE_BRANCH for $GITHUB_SHA. Wait for it to pass on this commit, then re-run this workflow."
            exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        # https://doc.rust-lang.org/rustc/platform-support.html
        include:
          - host: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            # The released plugin is built by this release's own CLI, not the
            # upstream Rojo pinned in rokit.toml.
            plugin: true

          - host: linux
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

          - host: macos
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      BIN: rojo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Keep in sync with ci.yml.
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      # Published binaries are built from scratch. A restored cache could
      # carry build outputs or registry sources written by other workflows,
      # including CI runs on pull request branches.
      - name: Build Release
        run: cargo build --release --locked --verbose --target ${{ matrix.target }}

      - name: Generate Artifact Name
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "ARTIFACT_NAME=$BIN-${TAG_NAME#v}-${{ matrix.label }}.zip" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          mkdir staging

          if [ "${{ matrix.host }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" staging/
            cd staging
            7z a ../$ARTIFACT_NAME *
          else
            cp "target/${{ matrix.target }}/release/$BIN" staging/
            cd staging
            zip ../$ARTIFACT_NAME *
          fi

      - name: Upload Archive to Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ env.ARTIFACT_NAME }}

      - name: Build Plugin
        if: matrix.plugin
        run: target/${{ matrix.target }}/release/$BIN build plugin.project.json --output Rojo.rbxm

      - name: Upload Plugin to Artifacts
        if: matrix.plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rojo.rbxm
          path: Rojo.rbxm

  release:
    name: Create Release
    needs: [ci-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create Draft Release with Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          (cd dist && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" dist/* SHA256SUMS
